[project]
name = "fwriter"
version = "0.1.0"
description = "Терминальный (TUI) редактор глав Ficbook.net с локальной историей версий — для авторов и их помощников: соавторов, переводчиков, бет и гамм."
readme = "README.md"
authors = [
    { name = "Razhon", email = "me@razhon.xyz" }
]
requires-python = ">=3.14.7"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "platformdirs>=4.11.2",
    "textual>=8.2.8",
]

[project.scripts]
fwriter = "fwriter.run:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "textual-dev>=1.8.0",
]
